<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Clone • Auto-Jira Workspace</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="fb-nav">
    <div class="nav-left">
      <div class="fb-logo" title="Facebook">f</div>
      <div class="search-box">
        <svg class="icon-search" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Search Facebook..." id="search-input">
      </div>
    </div>

    <nav class="nav-center">
      <button class="nav-tab active" title="Home" data-tab="home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </button>
      <button class="nav-tab" title="Tickets" data-tab="tickets">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
        </svg>
      </button>
      <button class="nav-tab" title="Profile" data-tab="profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </button>
    </nav>

    <div class="nav-right">
      <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
      <div class="user-avatar" title="User Avatar">A</div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="fb-container">
    <!-- Left Sidebar -->
    <aside class="sidebar-left">
      <ul class="sidebar-menu">
        <li class="menu-item active" data-tab-link="home">
          <span class="menu-icon">🏠</span>
          <span class="menu-text">Home Feed</span>
        </li>
        <li class="menu-item" data-tab-link="tickets">
          <span class="menu-icon">🎫</span>
          <span class="menu-text">Jira Tickets</span>
        </li>
        <li class="menu-item" data-tab-link="profile">
          <span class="menu-icon">👤</span>
          <span class="menu-text">Profile</span>
        </li>
      </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Home Tab View -->
      <section id="tab-home" class="tab-view active">
        <div class="create-post-card">
          <div class="create-post-top">
            <div class="user-avatar">A</div>
            <input type="text" id="post-input" placeholder="What's on your mind, Developer?">
          </div>
          <div class="create-post-actions">
            <button class="post-btn" id="submit-post-btn">Post</button>
          </div>
        </div>
        <div id="posts-feed" class="feed-list">
          <!-- Dynamic posts will render here -->
        </div>
      </section>

      <!-- Tickets Tab View -->
      <section id="tab-tickets" class="tab-view">
        <div class="tickets-header">
          <h2>Workspace Tickets</h2>
          <div class="filter-controls">
            <select id="status-filter">
              <option value="ALL">All Statuses</option>
              <option value="TODO">To Do</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="IN_REVIEW">In Review</option>
              <option value="DONE">Done</option>
              <option value="REJECTED_NEEDS_INFO">Needs Info</option>
            </select>
          </div>
        </div>
        <div id="tickets-feed" class="feed-list">
          <!-- Dynamic tickets will render here -->
        </div>
      </section>

      <!-- Profile Tab View -->
      <section id="tab-profile" class="tab-view">
        <div class="profile-card">
          <div class="profile-header">
            <div class="profile-avatar">A</div>
            <div class="profile-info">
              <h3>Auto-Jira Autonomous Agent</h3>
              <p>Engineering Workspace System</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Right Sidebar -->
    <aside class="sidebar-right">
      <div class="widget-card">
        <h4>System Status</h4>
        <div class="status-indicator">
          <span class="dot active"></span> Workspace Active
        </div>
      </div>
    </aside>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
